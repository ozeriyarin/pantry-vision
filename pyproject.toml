[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pantry-vision"
version = "0.1.0"
description = "Hebrew Telegram bot that turns fridge and pantry photos into an inventory."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Yarin Ozeri" }]
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "onnxruntime>=1.18,<2",
  "numpy>=1.26,<3",
  "pillow>=10.3,<12",
  "google-cloud-firestore>=2.16,<3",
  "google-cloud-storage>=2.16,<4",
  "google-auth>=2.29,<3",
  "anthropic>=0.50",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
# Offline only: export and fine-tuning. Never installed in the service image.
training = [
  "ultralytics>=8.3,<9",
  "clip @ git+https://github.com/ultralytics/CLIP.git",
  "onnx>=1.16",
  "onnxslim>=0.1.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
